name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only ci.yml cancels superseded runs. release.yml deliberately has no
# concurrency group: a cancelled release run would leave a tag with no
# GitHub Release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
